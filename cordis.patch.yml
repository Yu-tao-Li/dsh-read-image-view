# dsh-read-image-view — DSH bundle patch layer
#
# Client-only plugin: the server half (lib/index.js) is a no-op. The browser
# half (lib/client.js, declared via dsh.client in package.json) registers a
# dedicated read_image row into the Tool-owned keyed view slot (
# tool.call.toolview, key "read_image" ) and renders the result's image
# through the durable attachment store's session.attachment RPC, using the
# built-in ImageGallery atoms (loading, retry, original-image lightbox).
#
# The entry exists so the package is a loader entry the client-module
# scanner (dsh-client-modules) can discover; no host services are needed.

- insert:
    - id: dsh-read-image-view
      name: dsh-read-image-view
