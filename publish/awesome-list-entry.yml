url: https://github.com/Yu-tao-Li/dsh-read-image-view
name: Yu-tao-Li/dsh-read-image-view
category: ui
description:
  en: 'For displaying read_image results in the DSH Web GUI: a DSH 0.2-compatible Read image row with a default-expanded message-style card over a PS-style transparency checkerboard, merged read-N-images rows within one user request, and an in-page full-resolution lightbox (zoom buttons, mouse wheel, 1:1 original size).'
  zh: 用于在 DeepSeek Harness Web GUI 展示 read_image 结果：兼容 DSH 0.2 的专用 Read image 行，默认展开消息图片卡（透明棋盘格）+ 同一次请求的多图合并行 + 页面内全精度放大层（缩放按钮/滚轮/1:1 原始尺寸）。
