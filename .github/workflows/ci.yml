name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Core, bundle sync and real Chromium rendering; Desktop is tested separately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # All dependencies are test-only; the shipped client uses host React.
      - name: Install development dependencies
        run: npm ci

      - name: Install Chromium test runtime
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      # The committed bundle must match its sources (src/ + core).
      - name: Bundle sync check
        run: node scripts/build-client.mjs --check

      # Core unit tests (imageCardModel, session/attachment RPC, zoom/fit, labels).
      - name: Core unit tests
        run: npm test

      - name: Browser rendering and interaction regressions
        run: npm run test:browser
        env:
          DRI_BROWSER_OUTPUT: ${{ runner.temp }}/dri-browser

      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: ${{ runner.temp }}/dri-browser
          if-no-files-found: warn
